name: Validar publicación

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip
          cache-dependency-path: |
            04_reproduccion_python/requirements.txt
            pyproject.toml

      - name: Instalar entorno fijado
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r 04_reproduccion_python/requirements.txt
          python -m pip check
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Reconstruir resultados
        run: |
          python 04_reproduccion_python/reproducir_saldo_forestal_guatemala.py
          python 04_reproduccion_python/generar_manifiestos.py

      - name: Ejecutar cuaderno y validar publicación
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CUADERNOS < <(find 04_reproduccion_python -maxdepth 1 -type f -name '*.ipynb' -print)
          test "${#CUADERNOS[@]}" -eq 1
          mkdir -p build/cuadernos
          jupyter nbconvert \
            --to notebook \
            --execute "${CUADERNOS[0]}" \
            --output-dir build/cuadernos \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3
          export CUADERNO_EJECUTADO="build/cuadernos/$(basename "${CUADERNOS[0]}")"
          python -m pytest

      - name: Conservar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-reproducibilidad
          if-no-files-found: warn
          path: |
            build/cuadernos/*.ipynb
            build/resultados_saldo_forestal_guatemala.zip
            05_verificacion/controles_calidad_saldo_forestal_guatemala_2016_2020.csv
            05_verificacion/reproduccion_por_sitio_recuperacion_biomasa_20_anios.csv
            05_verificacion/manifiesto_archivos.csv
            05_verificacion/manifiesto_resultados.csv

name: Validar publicación

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Instalar entorno fijado
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r requirements.txt
          python -m pip check
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Reconstruir resultados
        run: python scripts/run_pipeline.py

      - name: Ejecutar cuaderno y validar publicación
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CUADERNOS < <(find notebooks -maxdepth 1 -type f -name '*.ipynb' -print)
          test "${#CUADERNOS[@]}" -eq 1
          mkdir -p build/notebooks
          jupyter nbconvert \
            --to notebook \
            --execute "${CUADERNOS[0]}" \
            --output-dir build/notebooks \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3
          export CUADERNO_EJECUTADO="build/notebooks/$(basename "${CUADERNOS[0]}")"
          python -m pytest

      - name: Conservar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-reproducibilidad
          if-no-files-found: warn
          path: |
            build/notebooks/*.ipynb
            outputs/tables/controles_calidad.csv
            outputs/downloads/manifiesto_resultados.csv

name: Publicar versión 1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    if: github.repository == 'JA-Osorio/saldo-forestal-ponderado-guatemala'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Comprobar si la entrega ya existe
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar que la etiqueta aprobada existe
        if: steps.release.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" >/dev/null

      - name: Obtener la versión aprobada sin mover la etiqueta
        if: steps.release.outputs.existe == 'false'
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Configurar Python 3.11
        if: steps.release.outputs.existe == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: pip
          cache-dependency-path: |
            04_reproduccion_python/requirements.txt
            pyproject.toml

      - name: Reconstruir y verificar la versión etiquetada
        if: steps.release.outputs.existe == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r 04_reproduccion_python/requirements.txt
          python -m pip check
          python -m ipykernel install --user --name python3 --display-name "Python 3"
          python 04_reproduccion_python/reproducir_saldo_forestal_guatemala.py
          mapfile -t CUADERNOS < <(find 04_reproduccion_python -maxdepth 1 -type f -name '*.ipynb' -print)
          test "${#CUADERNOS[@]}" -eq 1
          mkdir -p build/cuadernos
          jupyter nbconvert \
            --to notebook \
            --execute "${CUADERNOS[0]}" \
            --output-dir build/cuadernos \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3
          export CUADERNO_EJECUTADO="build/cuadernos/$(basename "${CUADERNOS[0]}")"
          python -m pytest

      - name: Crear la entrega estable
        if: steps.release.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La entrega v1.0.0 fue creada por otra ejecución; se conserva intacta."
            exit 0
          fi
          gh release create v1.0.0 \
            build/resultados_saldo_forestal_guatemala.zip \
            --verify-tag \
            --title "Deforestación bruta, recuperación y saldo forestal ponderado en Guatemala — v1.0.0" \
            --notes-file .github/notas_publicacion_v1.0.0.md

      - name: Informar que la entrega existente se conserva
        if: steps.release.outputs.existe == 'true'
        run: echo "La entrega v1.0.0 ya existe; no se modifica la entrega ni su etiqueta."

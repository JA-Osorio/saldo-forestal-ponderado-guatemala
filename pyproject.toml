[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "saldo-forestal-ponderado-guatemala"
version = "1.0.0"
description = "Cálculos reproducibles para contrastar la deforestación neta con saldos forestales ponderados en Guatemala."
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Juan Alejandro Osorio" },
]
dependencies = [
  "ipython==8.30.0",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "plotly==5.24.1",
]

[project.optional-dependencies]
notebook = [
  "ipykernel==6.29.5",
  "nbclient==0.10.2",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
]
test = [
  "pytest==8.3.4",
]
dev = [
  "ipykernel==6.29.5",
  "nbclient==0.10.2",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
  "pytest==8.3.4",
]

[tool.setuptools]
package-dir = { "" = "04_reproduccion_python/src" }

[tool.setuptools.packages.find]
where = ["04_reproduccion_python/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["05_verificacion/tests"]
xfail_strict = true
